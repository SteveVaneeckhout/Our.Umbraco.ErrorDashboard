name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A newer push to the same branch makes this run pointless.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/ErrorDashboard/Client/package-lock.json

      # Build the client explicitly. The csproj has a target that does this, but only when the
      # bundle is missing - it would silently reuse a stale wwwroot, which is exactly how source
      # maps once ended up inside a release package.
      - name: Build the backoffice client
        working-directory: src/ErrorDashboard/Client
        run: |
          npm ci
          npm run build

      - name: Restore
        run: dotnet restore Our.Umbraco.ErrorDashboard.slnx

      - name: Check formatting
        run: dotnet format Our.Umbraco.ErrorDashboard.slnx --verify-no-changes --no-restore

      - name: Build
        run: dotnet build Our.Umbraco.ErrorDashboard.slnx -c Release --no-restore -p:BuildClient=false

      # Runs on Microsoft.Testing.Platform - see global.json. Guarded because `dotnet test` exits 1,
      # not 0, when a solution contains no test project at all. The guard means a repository without
      # one stays green, and starts testing automatically the day a test project is added.
      - name: Test
        run: |
          if ls src/*.Tests/*.csproj >/dev/null 2>&1; then
            dotnet test --solution Our.Umbraco.ErrorDashboard.slnx -c Release --no-build -p:BuildClient=false
          else
            echo 'No test project in this repository yet - skipping.'
          fi

      - name: Pack
        run: dotnet pack src/ErrorDashboard/ErrorDashboard.csproj -c Release --no-build -p:BuildClient=false -o artifacts

      # Both of these have regressed silently once already: a stray edit dropped IncludeSymbols so
      # no .snupkg was produced, and a stale wwwroot put source maps inside the package. Neither
      # fails a build, so assert them here instead.
      - name: Check the package
        run: |
          shopt -s nullglob
          packages=(artifacts/*.nupkg)
          symbols=(artifacts/*.snupkg)
          [ ${#packages[@]} -eq 1 ] || { echo "expected exactly one .nupkg, found ${#packages[@]}"; exit 1; }
          [ ${#symbols[@]} -eq 1 ] || { echo "expected a .snupkg beside it - have symbols regressed?"; exit 1; }

          contents=$(unzip -Z1 "${packages[0]}")
          echo "$contents"

          check() { echo "$contents" | grep -q "$1" || { echo "missing from the package: $1"; exit 1; }; }
          check "lib/net10.0/Our.Umbraco.ErrorDashboard.dll"
          check "lib/net10.0/Our.Umbraco.ErrorDashboard.xml"
          check "^icon.png$"
          check "^README.md$"
          check "App_Plugins/ErrorDashboard/umbraco-package.json"

          if echo "$contents" | grep -q '\.js\.map$'; then
            echo "source maps leaked into the package"; exit 1
          fi
          echo "Package contents look right."

      # So a package can be downloaded and inspected without publishing anything.
      - name: Upload the package
        uses: actions/upload-artifact@v7
        with:
          name: Our.Umbraco.ErrorDashboard-nupkg
          path: artifacts/*
          if-no-files-found: error
