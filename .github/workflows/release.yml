name: Release

# Publishing is driven by a GitHub Release: create one whose tag is the version (v1.0.0, or
# v1.0.0-rc.1 marked as a pre-release) and this pushes that version to NuGet.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to pack, without a leading v (dry run only)'
        required: true
        default: '1.0.0-dev'

permissions:
  contents: read
  id-token: write   # required for the OIDC exchange with NuGet trusted publishing

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/ErrorDashboard/Client/package-lock.json

      # The tag is the single source of truth for the version. Strip the leading v.
      - name: Work out the version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            VERSION="${{ github.event.release.tag_name }}"
            VERSION="${VERSION#v}"
          else
            VERSION="${{ github.event.inputs.version }}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Packing $VERSION"

      - name: Build the backoffice client
        working-directory: src/ErrorDashboard/Client
        run: |
          npm ci
          npm run build

      - name: Restore
        run: dotnet restore Our.Umbraco.ErrorDashboard.slnx

      - name: Build
        run: dotnet build Our.Umbraco.ErrorDashboard.slnx -c Release --no-restore -p:BuildClient=false

      # Guarded for the same reason as in ci.yml: no test project means exit 1, not 0.
      - name: Test
        run: |
          if ls src/*.Tests/*.csproj >/dev/null 2>&1; then
            dotnet test --solution Our.Umbraco.ErrorDashboard.slnx -c Release --no-build -p:BuildClient=false
          else
            echo 'No test project in this repository yet - skipping.'
          fi

      - name: Pack
        run: >
          dotnet pack src/ErrorDashboard/ErrorDashboard.csproj -c Release --no-build -p:BuildClient=false
          -p:Version=${{ steps.version.outputs.version }} -o artifacts

      # The same assertions ci.yml makes, and they matter more here: this is the last point at
      # which a bad package can still be stopped. A push to NuGet cannot be taken back.
      - name: Check the package
        run: |
          shopt -s nullglob
          packages=(artifacts/*.nupkg)
          symbols=(artifacts/*.snupkg)
          [ ${#packages[@]} -eq 1 ] || { echo "expected exactly one .nupkg, found ${#packages[@]}"; exit 1; }
          [ ${#symbols[@]} -eq 1 ] || { echo "expected a .snupkg beside it - have symbols regressed?"; exit 1; }

          case "${packages[0]}" in
            *"${{ steps.version.outputs.version }}.nupkg") ;;
            *) echo "packed ${packages[0]}, expected version ${{ steps.version.outputs.version }}"; exit 1 ;;
          esac

          contents=$(unzip -Z1 "${packages[0]}")
          echo "$contents"

          check() { echo "$contents" | grep -q "$1" || { echo "missing from the package: $1"; exit 1; }; }
          check "lib/net10.0/Our.Umbraco.ErrorDashboard.dll"
          check "lib/net10.0/Our.Umbraco.ErrorDashboard.xml"
          check "^icon.png$"
          check "^README.md$"
          check "App_Plugins/ErrorDashboard/umbraco-package.json"

          if echo "$contents" | grep -q '\.js\.map$'; then
            echo "source maps leaked into the package"; exit 1
          fi
          echo "Package contents look right."

      - name: Upload the package
        uses: actions/upload-artifact@v7
        with:
          name: Our.Umbraco.ErrorDashboard-${{ steps.version.outputs.version }}
          path: artifacts/*
          if-no-files-found: error

      # Exchanges this job's OIDC token for a short-lived NuGet API key. It lasts an hour and is
      # single-use, so it is requested immediately before the push, never earlier.
      - name: NuGet login
        if: github.event_name == 'release'
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push to NuGet
        if: github.event_name == 'release'
        run: >
          dotnet nuget push "artifacts/*.nupkg"
          --api-key ${{ steps.login.outputs.NUGET_API_KEY }}
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate
